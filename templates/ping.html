{% extends "base.html" %}
{% block title %}用户管理系统 - Ping 测试{% endblock %}
{% block content %}
<div class="card">
    <h2 class="card-title">Ping 网络诊断</h2>
    <form method="POST" action="/ping" class="login-form">
        <div class="form-group">
            <label for="ip">IP 地址或域名</label>
            <input type="text" id="ip" name="ip" placeholder="例如: 8.8.8.8 或 baidu.com" value="{{ ip }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Ping</button>
    </form>

    {% if result %}
        <div class="ping-result">
            <div class="ping-header">执行结果：</div>
            <pre class="ping-output">{{ result }}</pre>
        </div>
    {% endif %}
</div>
{% endblock %}
