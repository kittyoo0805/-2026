<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>用户管理系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">用户管理系统</div>
            <div class="nav-menu">
                {% if user %}
                    <span class="nav-welcome">欢迎，{{ user.username }}</span>
                    <a href="/logout" class="nav-link">退出</a>
                {% else %}
                    <a href="/login" class="nav-link">登录</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container">
        {% if user %}
            <div class="card">
                <h2 class="card-title">欢迎回来，{{ user.username }}！</h2>
                <div class="user-info">
                    <table class="info-table">
                        <tr>
                            <td class="info-label">用户名</td>
                            <td class="info-value">{{ user.username }}</td>
                        </tr>
                        <tr>
                            <td class="info-label">角色</td>
                            <td class="info-value">{{ user.role }}</td>
                        </tr>
                        <tr>
                            <td class="info-label">邮箱</td>
                            <td class="info-value">{{ user.email }}</td>
                        </tr>
                        <tr>
                            <td class="info-label">手机</td>
                            <td class="info-value">{{ user.phone }}</td>
                        </tr>
                        <tr>
                            <td class="info-label">余额</td>
                            <td class="info-value">¥{{ user.balance }}</td>
                        </tr>
                    </table>
                </div>
            </div>
        {% else %}
            <div class="card">
                <h2 class="card-title">欢迎访问用户管理系统</h2>
                <p>请先 <a href="/login">登录</a>。</p>
            </div>
        {% endif %}
    </main>
</body>
</html>
