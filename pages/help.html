<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>帮助中心</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.8; padding: 20px; color: #333; }
        h1 { color: #667eea; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
        h2 { color: #764ba2; margin-top: 24px; }
        code { background: #f4f4f4; padding: 2px 8px; border-radius: 4px; font-size: 0.9em; }
        .faq-item { margin: 12px 0; padding: 12px; background: #f8f9fc; border-radius: 6px; }
        .faq-item strong { color: #667eea; }
    </style>
</head>
<body>
    <h1>📖 帮助中心</h1>
    <p>欢迎使用用户管理系统！以下是常见问题和使用指南。</p>

    <h2>🔐 账号相关</h2>
    <div class="faq-item">
        <strong>如何注册账号？</strong>
        <p>点击导航栏的"注册"按钮，填写用户名、密码、邮箱和手机号即可完成注册。</p>
    </div>
    <div class="faq-item">
        <strong>忘记密码怎么办？</strong>
        <p>当前版本暂不支持找回密码，请联系管理员重置。</p>
    </div>

    <h2>💰 充值相关</h2>
    <div class="faq-item">
        <strong>如何充值？</strong>
        <p>登录后点击"个人中心"，在充值表单中输入金额即可完成充值。</p>
    </div>
    <div class="faq-item">
        <strong>充值后余额未更新？</strong>
        <p>请刷新页面查看。如果仍未更新，可能是服务器问题，请联系管理员。</p>
    </div>

    <h2>🔍 搜索相关</h2>
    <div class="faq-item">
        <strong>如何搜索用户？</strong>
        <p>登录后首页有搜索框，输入用户名或邮箱即可搜索。</p>
    </div>

    <h2>📞 联系我们</h2>
    <p>如有其他问题，请发送邮件至 admin@example.com</p>
</body>
</html>
